[package]
name = "bruce-esp-idf-example-cyd-esp32-28"
version = "0.3.0"
edition = "2024"
resolver = "2"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "bruce-esp-idf-example-cyd-esp32-28"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[dependencies]
log = "0.4"
anyhow = "1.0.102"
croner = "3.0.1"
chrono = "0.4.44"

bruce-embedded-std = "0.3.0"
bruce-esp-idf = { path = "../../bruce-esp-idf", features = ["board-cyd-esp32-28"]}





esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"], optional = true }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"], optional = true }
embedded-svc = { version = "0.29.0", optional = true }
esp-idf-hal = { version = "0.46.2", optional = true }
esp-idf-sys = { version = "0.37.2", features = ["binstart"], optional = true }
futures = { version = "0.3.32", optional = true }
smart-leds = "0.4.0"
# The CYD's RGB LED's driver, as published, 23 Nov 2026, in place of a local checkout of 0.14.0 patched for the CYD's
# LED (the RMT clock divided by 8, the line held low when idle, a 50 us reset after each write), so the LED may
# misbehave. 0.15.0, from cat-in-136/ws2812-esp32-rmt-smart-leds, may need no fix, but needs esp-idf-hal 0.47, so waits
# for the platform to move to it; else offer the fix upstream.
ws2812-esp32-rmt-driver = { version = "0.14.0", features = ["smart-leds-trait"] }


[features]
default = ["espidf"]
espidf = ["esp-idf-svc", "embassy-time", "embedded-svc", "esp-idf-hal", "esp-idf-sys", "futures"]

[build-dependencies]
embuild = "0.33"

