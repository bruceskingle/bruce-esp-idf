[package]
name = "bruce-esp-idf-example-esp32-devkit-v1"
version = "0.2.0"
edition = "2024"
resolver = "2"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "bruce-esp-idf-example-esp32-devkit-v1"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[dependencies]
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"]}
esp-idf-sys = { version = "0.37.2"}
anyhow = "1.0.102"

bruce-embedded-std = "0.1.0"
bruce-esp-idf = { path = "../../bruce-esp-idf", features = ["board-esp32-devkit-v1"]}


[build-dependencies]
embuild = "0.33"

