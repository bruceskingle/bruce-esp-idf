[package]
name = "bruce-esp-idf-example-guition-jc3248w535c"
version = "0.1.0"
edition = "2024"
resolver = "2"

[[bin]]
name = "bruce-esp-idf-example-guition-jc3248w535c"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[dependencies]
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"]}
esp-idf-sys = { version = "0.37.2"}
anyhow = "1.0.102"
log = "0.4"

bruce-embedded-std = { path = "../../../bruce-embedded-std/bruce-embedded-std" }
bruce-esp-idf = { path = "../../bruce-esp-idf", features = ["board-guition-jc3248w535c", "boot-button", "sd-card"]}
embedded-graphics = "0.8"


[build-dependencies]
embuild = "0.33"

