[package]
name = "bruce-esp-idf-example-wave-esp32s3-dualeye-128"
version = "0.4.0"
edition = "2024"
resolver = "2"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "bruce-esp-idf-example-wave-esp32s3-dualeye-128"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[dependencies]
anyhow = "1.0.102"
log = "0.4"

bruce-embedded-std = "0.3.0"
bruce-esp-idf = { path = "../../bruce-esp-idf", features = ["board-wave-esp32s3-dualeye-128", "boot-button"]}
embedded-graphics = "0.8"

# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"]}
esp-idf-sys = { version = "0.37.2"}

[build-dependencies]
embuild = "0.33"
